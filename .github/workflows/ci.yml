# CI for the-great-infocon-recovery. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
      id-token: write   # Doppler OIDC (see the shared repository's README)
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:12", "debian:13", "ubuntu:24.04"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install --no-deps -e .
      test-command: python -m pytest tests/ -v
      lint-install-command: |
        pip install ruff
      lint-command: |
        ruff check .
      # No smoke-command: the old workflow had none, and `infocon-scraper --help` after `pip install .` fails with
      # ModuleNotFoundError: ddv_profiles, because pyproject.toml's py-modules omits ddv_profiles and drive_setup.
      docker-build: false
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
    with:
      shfmt-args: -i 4 -ci
      # Pre-existing: the old workflow never linted shell. Advisory until the scripts are cleaned up (see the PR).
      shellcheck-continue-on-error: true
      shfmt-continue-on-error: true
      workflow-lint: false   # the ci job above already lints the workflow files
      egress-policy: block
